name: Publish

permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the docs site too: its postinstall generates the Nuxt tsconfig vite reads for the landing test.
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          run-install: |
            - cwd: .
            - cwd: docs
              args: ['--frozen-lockfile']

      - run: pnpm test

      - run: pnpm test:packed

      - run: pnpm publish
