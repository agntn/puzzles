name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # One install covers docs/ too, and its postinstall writes the Nuxt types the linter reads.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: v26.10.0
          cache: true
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test packed layout
        run: pnpm test:packed

      - name: Test
        run: pnpm test
