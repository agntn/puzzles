packages:
  - .

# Without it docs/node_modules holds only direct dependencies, Node walks up to the root's
# node_modules, and the server bundle can end up with a second copy of Vue.
shamefullyHoist: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  vue-demi: true
  core-js-pure: false

minimumReleaseAgeExclude:
  - "@agntn/*"
